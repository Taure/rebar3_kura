name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, next]

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    uses: Taure/erlang-ci/.github/workflows/ci.yml@v2.0.5
    with:
      enable-elp-eqwalize: true
      elp-version: '2026-10-14'
      enable-dependency-submission: true
      enable-summary: true
      enable-sbom-scan: true
      enable-sbom: true
      enable-coverage: true
      enable-audit: false
      otp-version: '29'
      otp-matrix: '["28", "29"]'
